name: Sync production calendar and deploy
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-production-calendar.py'
      - '.github/workflows/sync-production-calendar.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and validate 5- and 6-day calendars
        run: python3 scripts/sync-production-calendar.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate schedule rules
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Publish checked source snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/production-calendar.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh production calendar source snapshot"
            git push origin HEAD:main
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: sync-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
