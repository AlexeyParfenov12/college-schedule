name: Sync production calendar and deploy
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-production-calendar.py'
      - 'scripts/monitor-official-calendar.py'
      - 'scripts/notify-calendar-admin.py'
      - 'scripts/test_calendar_monitor.py'
      - '.github/workflows/sync-production-calendar.yml'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  # Do not cancel a calendar refresh when normal source updates also deploy Pages.
  group: production-calendar-sync
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check official monitor and alert logic without network access
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Monitor official publications for new calendar decrees
        run: python3 scripts/monitor-official-calendar.py
      - name: Fetch and validate 5- and 6-day calendars
        run: python3 scripts/sync-production-calendar.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate schedule rules
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Persist only validated calendar snapshots on current main
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp public/production-calendar.json "$temp_dir/production-calendar.json"
          cp public/official-calendar-monitor.json "$temp_dir/official-calendar-monitor.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$temp_dir/production-calendar.json" public/production-calendar.json
            cp "$temp_dir/official-calendar-monitor.json" public/official-calendar-monitor.json
            git add public/production-calendar.json public/official-calendar-monitor.json
            if git diff --cached --quiet; then
              echo "Validated snapshots already match main"
              pushed=true
              break
            fi
            git commit -m "Update verified production-calendar snapshots"
            if git push origin HEAD:main; then
              echo "Validated calendar snapshot committed on current main"
              pushed=true
              break
            fi
            echo "Main changed during publication; preparing a fresh commit"
            sleep 2
          done
          if [ "$pushed" != true ]; then
            echo "::error::Calendar snapshot could not be saved after four retries"
            exit 1
          fi
      - name: Archive checked calendar snapshots and official-monitor diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: checked-production-calendar
          path: |
            public/production-calendar.json
            public/official-calendar-monitor.json
          retention-days: 90
      - name: Final regression and site build against current main
        run: |
          npm test
          npm run build
      - name: Notify college academic office of discrepancies
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACADEMIC_ADMIN_EMAIL: ${{ secrets.ACADEMIC_ADMIN_EMAIL }}
          CALENDAR_SMTP_HOST: ${{ secrets.CALENDAR_SMTP_HOST }}
          CALENDAR_SMTP_PORT: ${{ secrets.CALENDAR_SMTP_PORT }}
          CALENDAR_SMTP_USERNAME: ${{ secrets.CALENDAR_SMTP_USERNAME }}
          CALENDAR_SMTP_PASSWORD: ${{ secrets.CALENDAR_SMTP_PASSWORD }}
          CALENDAR_SMTP_FROM: ${{ secrets.CALENDAR_SMTP_FROM }}
        run: python3 scripts/notify-calendar-admin.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: sync-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
